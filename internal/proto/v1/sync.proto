// ------------------------------------
// 4.5 Unified Baseline Conflict Message (SyncConflict)
// ------------------------------------

// SyncConflictMessage is the single payload for baseline conflicts across all four
// resource kinds. Only sent to connections that negotiated syncBaselineVersion >= 1.
// SyncConflictMessage 是四类资源共用的基线冲突载荷，仅发送给已协商
// syncBaselineVersion >= 1 的连接。
message SyncConflictMessage {
    string kind = 1;            // note | file | setting | folder // 资源类型
    string path = 2;            // Full path // 完整路径
    string pathHash = 3;        // Existing path hash // 现有路径哈希
    string reason = 4;          // both_modified | remote_deleted | local_deleted | no_baseline | baseline_unverified | server_missing | revision_changed // 冲突原因
    string serverHash = 5;      // Server active content hash; empty when not applicable // 服务端活跃内容哈希；不适用时为空
    string serverRevision = 6;  // Current server state revision token // 当前服务端状态令牌
    bool serverDeleted = 7;     // Current state is a tombstone // 当前是墓碑
    string baseHash = 8;        // Content baseline used for this decision // 本次判断使用的内容基线
    string baseContent = 9;     // Only when a real base is proven // 能证明是真实 base 时才提供
    bool baseMissing = 10;      // Real base content unavailable // 真实 base 内容不可用
    string serverContent = 11;  // Remote content for notes and text settings; never inlines attachment bytes // 笔记、文本配置的远端内容；附件不内联二进制
}

