syntax = "proto3";
package proto.v1;
option go_package = "github.com/haierkeys/fast-note-sync-service/internal/proto/v1;v1";

// WSMessage is the unified envelope structure for WebSocket communication
// WSMessage 是 WebSocket 通信的统一信封结构
message WSMessage {
    string type = 1;      // Message action type (e.g. "NoteSync", "NoteModifyAck") // 消息动作类型
    bytes data = 2;       // Target message payload serialized to bytes // 目标消息的序列化字节流
}

// WSResponse is the unified response envelope (analogous to Res struct)
// WSResponse 是统一的响应信封（与 Res 结构体对应）
message WSResponse {
    int32 code = 1;       // Status code // 状态码
    bool status = 2;      // Is success // 是否成功
    string message = 3;   // Response message // 响应消息
    bytes data = 4;       // Target response payload serialized to bytes // 目标响应载荷的序列化字节流
    string details = 5;   // Error details // 错误细节
    string vault = 6;     // Vault name // 笔记库名称
    string context = 7;   // Context // 上下文
    int32 pageIndex = 8;  // 1-BASED wire value (download window page attribution and idempotency key, see sync pipeline design §4): 0 (or absent) = non-paginated message; n>0 = download page n-1 (0-based internal page number). 1-based because proto3 doesn't encode zero values: a 0-based page 0 would decode as 0, indistinguishable from non-paginated messages. Sender: only filled for pv>=2 connections. The client-to-server PageAck.pageIndex request field stays 0-based and is NOT affected. // 线上值为 1-BASED（下行窗口的页归属与幂等去重依据，见同步流水线设计 §4）：0（或缺省）= 非分页消息；n>0 = 下载页 n-1（内部 0-based 页码）。采用 1-based 是因为 proto3 不编码零值：0-based 的第 0 页解码后为 0，与非分页消息无法区分。发送端：仅 pv>=2 连接填写。客户端→服务端的 PageAck.pageIndex 请求字段保持 0-based，不受影响
}

// ------------------------------------
// 0. Client Info (ClientInfo)
// ------------------------------------
message ClientInfoMessage {
    string name = 1;
    string version = 2;
    string type = 3;
    bool isDesktop = 4;
    bool isMobile = 5;
    bool isPhone = 6;
    bool isTablet = 7;
    bool isMacOS = 8;
    bool isWin = 9;
    bool isLinux = 10;
    string offlineSyncStrategy = 11;
    bool protobuf = 12;   // Request to upgrade to protobuf // 客户端请求启用 Protobuf
    uint32 syncBaselineVersion = 13; // Requested sync baseline protocol version; 0 = legacy // 客户端请求的同步基线协议版本；0 = 旧模式
}

message HistoricalVersion {
    string version = 1;
    string changelogContent = 2;
}

message CheckVersionInfo {
    bool githubAvailable = 1;
    bool versionIsNew = 2;
    string versionNewName = 3;
    string versionNewLink = 4;
    string versionNewChangelog = 5;
    string versionNewChangelogContent = 6;
    repeated HistoricalVersion versionHistory = 7;
    bool pluginVersionIsNew = 8;
    string pluginVersionNewName = 9;
    string pluginVersionNewLink = 10;
    string pluginVersionNewChangelog = 11;
    string pluginVersionNewChangelogContent = 12;
    repeated HistoricalVersion pluginVersionHistory = 13;
    int32 syncUpChunkNum = 14;
    int32 syncDownChunkNum = 15;
    int32 pipelineWindowUp = 16;   // Negotiated upload pipeline window; 0 = stop-and-wait // 上行流水线窗口协商值；0 = stop-and-wait
    int32 pipelineWindowDown = 17; // Negotiated download pipeline window; 0 = stop-and-wait // 下行流水线窗口协商值；0 = stop-and-wait
    uint32 syncBaselineVersion = 18; // Sync baseline version accepted by this connection; 0 = legacy // 本连接实际接受的同步基线版本；0 = 旧模式
}

// ------------------------------------
// 1. Note Messages (Note)
// ------------------------------------

message NoteSyncCheckRequest {
    string path = 1;
    string pathHash = 2;
    string contentHash = 3;
    int64 mtime = 4;
    int64 ctime = 5;
    string baseHash = 6;        // Last confirmed content hash // 最后一次确认对齐的内容哈希
    bool baseHashMissing = 7;   // Explicitly no trusted content baseline // 明确表示没有可信内容基线
    string baseRevision = 8;    // Server revision token at the confirmed version // 客户端确认该版本时获得的服务端版本令牌
}

message NoteSyncDelNote {
    string path = 1;
    string pathHash = 2;
    string baseHash = 3;
    bool baseHashMissing = 4;
    string baseRevision = 5;
}

message NoteSyncRequest {
    string context = 1;
    string vault = 2;
    int64 lastTime = 3;
    repeated NoteSyncCheckRequest notes = 4;
    repeated NoteSyncDelNote delNotes = 5;
    repeated NoteSyncDelNote missingNotes = 6;
    int32 batchIndex = 7;
    int32 totalBatches = 8;
}

message NoteModifyOrCreateRequest {
    string vault = 1;
    string path = 2;
    string pathHash = 3;
    string baseHash = 4;
    bool baseHashMissing = 5;
    string content = 6;
    string contentHash = 7;
    int64 ctime = 8;
    int64 mtime = 9;
    bool createOnly = 10;
    string context = 11;
    bool isConflictResolved = 12;
    string baseRevision = 13;
}

message NoteUpdateCheckRequest {
    string vault = 1;
    string path = 2;
    string pathHash = 3;
    string contentHash = 4;
    int64 ctime = 5;
    int64 mtime = 6;
    string baseHash = 7;
    bool baseHashMissing = 8;
    string baseRevision = 9;
}

message NoteDeleteRequest {
    string vault = 1;
    string path = 2;
    string pathHash = 3;
    string context = 4;
    string baseHash = 5;
    bool baseHashMissing = 6;
    string baseRevision = 7;
}

message NoteRenameRequest {
    string vault = 1;
    string path = 2;
    string pathHash = 3;
    string oldPath = 4;
    string oldPathHash = 5;
    string context = 6;
}

message NoteGetRequest {
    string vault = 1;
    string path = 2;
    string pathHash = 3;
    bool isRecycle = 4;
}

// --- Note Responses ---

message NoteSyncModifyMessage {
    string path = 1;
    string pathHash = 2;
    string content = 3;
    string contentHash = 4;
    int64 ctime = 5;
    int64 mtime = 6;
    int64 lastTime = 7;
    string revision = 8; // Server revision token of the confirmed state // 已确认状态的服务端版本令牌
}

message NoteSyncDeleteMessage {
    string path = 1;
    string pathHash = 2;
    int64 ctime = 3;
    int64 mtime = 4;
    int64 size = 5;
    int64 lastTime = 6;
    string revision = 7;    // Revision token of the tombstone state // 墓碑状态的版本令牌
    string contentHash = 8; // Last content hash before deletion // 删除前最后内容哈希
}

message NoteSyncRenameMessage {
    string path = 1;
    string pathHash = 2;
    string contentHash = 3;
    int64 ctime = 4;
    int64 mtime = 5;
    int64 size = 6;
    string oldPath = 7;
    string oldPathHash = 8;
    int64 lastTime = 9;
}

message NoteSyncMtimeMessage {
    string path = 1;
    int64 ctime = 2;
    int64 mtime = 3;
    int64 lastTime = 4;
    string contentHash = 5; // Confirmed content hash // 确认一致的内容哈希
    string revision = 6;    // Confirmed server revision token // 确认的服务端版本令牌
}

message NoteSyncEndMessage {
    int64 lastTime = 1;
    int64 needUploadCount = 2;
    int64 needModifyCount = 3;
    int64 needSyncMtimeCount = 4;
    int64 needDeleteCount = 5;
    int64 needConflictCount = 6; // Persisted conflicts in this round // 本轮已持久化的冲突数量
}

message NoteSyncNeedPushMessage {
    string path = 1;
    string pathHash = 2;
    string serverContent = 3;
    string baseContent = 4;
    string serverHash = 5;
    bool baseMissing = 6; // No verifiable base content is available // 没有可证实的共同祖先内容
}

message NoteModifyAckMessage {
    int64 lastTime = 1;
    string path = 2;
    string pathHash = 3;
    string contentHash = 4;
    string revision = 5;
}

message NoteRenameAckMessage {
    int64 lastTime = 1;
    string path = 2;
    string pathHash = 3;
}

message NoteDeleteAckMessage {
    int64 lastTime = 1;
    string path = 2;
    string pathHash = 3;
    string revision = 4;
}

